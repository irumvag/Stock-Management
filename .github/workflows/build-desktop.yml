name: Build Windows Installer

on:
  push:
    branches: [release-2]
    paths:
      - 'desktop/**'
  workflow_dispatch: {}   # allow manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --publish always: electron-builder creates a GitHub Release, uploads
      # the .exe AND latest.yml (needed for auto-update to work).
      - name: Build and publish Windows installer
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also save the .exe as a workflow artifact for 30 days.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClubTMP-Stock-Manager-Setup
          path: desktop/dist/*.exe
          retention-days: 30
