name: Build Windows Installer

on:
  push:
    branches: [release-2]
    paths:
      - 'desktop/**'
  workflow_dispatch: {}   # allow manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Convert the SVG icon → ICO using sharp (no wine needed on Windows runner)
      - name: Generate icon.ico
        run: |
          npm install --save-dev sharp
          node -e "
            const sharp = require('sharp');
            const path = require('path');
            sharp('../web/public/icon.svg')
              .resize(256, 256)
              .toFile('build/icon.ico', (err) => {
                if (err) { console.error(err); process.exit(1); }
                console.log('icon.ico created');
              });
          "

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClubTMP-Stock-Manager-Setup
          path: desktop/dist/*.exe
          retention-days: 30

      # Also create a GitHub Release automatically when run on release-2
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/release-2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: Club TMP Stock Manager v2.${{ github.run_number }}
          body: |
            ## Desktop App — Windows Installer

            Download and run **ClubTMPStockManagerSetup.exe** to install.

            - Works offline (PWA cache)
            - Syncs to cloud when internet is available
            - Cashier + Owner + Waiter roles supported

            **Web app:** https://club-tmp-stock.vercel.app
          files: desktop/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
